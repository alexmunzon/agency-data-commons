name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      JEV_MODE: replay
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: uv sync --locked

      - name: Verify
        run: npm run verify
