[project]
name = "agency-data-commons"
version = "0.2.0"
description = "Shared schema, synthetic data generator, and Jev client for the Agency Data Trust Series. Synthetic data only."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
# Only what the three packages import. Generator output bytes depend on faker and openpyxl,
# so those two are pinned exactly (docs/versioning.md).
dependencies = [
    "faker==40.40.0",
    "httpx>=0.28.1",
    "openpyxl==3.1.5",
    "polars>=1.44.2",
    "pydantic>=2.13.5",
    "typer>=0.27.2",
]

[project.scripts]
synth = "synth_agency_data.cli:app"

[dependency-groups]
dev = [
    "pytest",
    "hypothesis",
    "ruff",
    "mypy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/agency_schema",
    "src/synth_agency_data",
    "src/jev_client",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["openpyxl", "openpyxl.*", "faker", "faker.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]  # so tests can import aik_reference
